name: CSC325 CI/CD

# Trigger: runs automatically on every push to main.
# Pull requests into main also run Setup, Dependencies and Test (Deploy is skipped for PRs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------- Stage 1: Setup ----------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show versions
        run: |
          python --version
          pip --version

  # ---------- Stage 2: Dependencies ----------
  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installed packages
        run: |
          pip check
          pip list

  # ---------- Stage 3: Test ----------
  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      # A failing test exits non-zero, which fails this job and the whole pipeline.
      - name: Run test suite
        run: python manage.py test --verbosity 2

  # ---------- Stage 4: Deploy ----------
  # "needs: test" means Deploy only starts after Test has finished successfully.
  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set"
            exit 1
          fi
          curl --fail -sS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo
          echo "Deploy requested for commit ${GITHUB_SHA}"

      - name: Wait until the new commit is live
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Repository variable APP_URL is not set"
            exit 1
          fi
          echo "Polling ${APP_URL}/api/health/ for commit ${GITHUB_SHA}"
          for i in $(seq 1 60); do
            LIVE=$(curl -s --max-time 30 "${APP_URL}/api/health/" -H "Accept: application/json" \
                   | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
            echo "Attempt $i: live commit = ${LIVE:-<no response>}"
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "Deployed! ${APP_URL}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::New version did not go live within 15 minutes"
          exit 1

      - name: Smoke test live app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail -sS "${APP_URL}/api/hello/" -H "Accept: application/json"
          echo
